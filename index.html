<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

<script>

function startTimer(){

function genSugg(a,hist){
  var r=[],pct=Math.round((a.score/a.total)*100),prev=hist.filter(function(h){return h.topicId===a.topicId;}),prevPct=prev.length>1?prev[prev.length-2].pct:null;

  else if(pct>=80)r.push({type:"success",icon:"✅",title:"Strong performance",body:pct+"% is exam-ready. Retry tomorrow to consolidate."});
  else if(pct>=60)r.push({type:"warning",icon:"📚",title:"Good but not exam-ready",body:pct+"% — CIL needs 70%+. Re-read notes and retry in 24hrs."});
  else if(pct>=40)r.push({type:"danger",icon:"⚠️",title:"Needs work",body:pct+"% — read the "+a.topicName+" notes thoroughly first."});
  else r.push({type:"danger",icon:"🔴",title:"Restart from basics",body:"Re-read complete "+a.topicName+" notes before attempting again."});
  if(prevPct!==null){var d=pct-prevPct;if(d>0)r.push({type:"success",icon:"📈",title:"Improved by "+d+"%!",body:"Keep this momentum."});else if(d<-5)r.push({type:"warning",icon:"📉",title:"Score dropped "+Math.abs(d)+"%",body:"Review explanations carefully."});else r.push({type:"info",icon:"➡️",title:"Score consistent",body:"Push for 5% more next attempt."});}
  var E=a.levelBreakdown.Easy||{},H=a.levelBreakdown.Hard||{};
  if((E.wrong||0)>0)r.push({type:"danger",icon:"🎯",title:(E.wrong)+" Easy question(s) wrong",body:"Re-read basic definitions and formulas."});
  if((H.correct||0)>0)r.push({type:"success",icon:"💪",title:"Got "+H.correct+"/"+(H.total||0)+" Hard right",body:"Excellent depth of understanding!"});
  var mw=Object.keys(a.tagBreakdown).filter(function(t){return t.indexOf("MUST KNOW")>=0;}).reduce(function(s,t){return s+(a.tagBreakdown[t].wrong||0);},0);
  if(mw>0)r.push({type:"danger",icon:"🔴",title:mw+" MUST KNOW wrong — Critical!",body:"These are CIL-confirmed PYQs. Memorise before next attempt."});
  if(a.avgTime>120)r.push({type:"warning",icon:"⏰",title:"Time too high",body:"Average "+fmt(a.avgTime)+"/Q — target under 90s."});
  else if(a.avgTime<=45)r.push({type:"success",icon:"⚡",title:"Excellent speed!",body:"Average "+fmt(a.avgTime)+"/Q."});
  return r;
}

function renderHome(){
  var cats=["All"].concat([].concat.apply([],TOPICS.map(function(t){return [t.category];})).filter(function(v,i,a){return a.indexOf(v)===i;}));

  }));

    var th=S.history.filter(function(h){return h.topicId===topic.id;});
    var lp=th.length?th[th.length-1].pct:null;
    var qc=avail?QUESTION_BANK[topic.id].length:0;

      avail?el("div",{style:"display:flex;align-items:center;gap:6px"},el("span",{style:"font-size:12px;color:#9ca3af"},qc+"Q"),el("span",{className:"badge",style:"background:#2563eb;color:#fff;padding:4px 10px"},"Start →")):el("span",{className:"badge",style:"background:#e5e7eb;color:#9ca3af"},"Soon")
    );
    var row=el("button",{className:"topic-row"+(avail?"":" unavail"),onclick:avail?function(){startQuiz(topic);}:null},

        el("span",{style:"font-weight:700;color:#9ca3af;width:20px;font-size:12px"},topic.id),
        el("div",null,[el("div",{style:"font-weight:600;font-size:14px;color:#1f2937"},topic.name),el("span",{className:"badge",style:(catColor[topic.category]||"background:#f3f4f6;color:#6b7280")+";margin-top:3px"},topic.category)])
      ),right

  }));
  var hbtn=S.history.length>0?el("button",{className:"btn",style:"background:rgba(255,255,255,.2);color:#fff;font-size:12px;padding:6px 12px",onclick:renderHistory},"📊 History ("+S.history.length+")"):null;
  render(el("div",{className:"wrap"},[

        hbtn

      el("div",{style:"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"},[
        el("span",{style:"background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px"},"🔴 MUST KNOW = CIL Confirmed"),
        el("span",{style:"background:rgba(255,255,255,.15);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px"},"⏱ Per-question Timer")
      ])

function startQuiz(topic){
  S.topic=topic;S.current=0;S.answers={};S.revealed={};S.score=null;S.qTimes={};S.totalSec=0;S.curSec=0;S.screen="quiz";
  renderQuiz();setTimeout(startTimer,100);
}

function renderQuiz(){

  var dots=el("div",{className:"dot-nav"},qs.map(function(_,i){
    var st="border-color:#d1d5db;background:#fff;color:#6b7280";

    else if(S.revealed[i])st="border-color:#f87171;background:#f87171;color:#fff";

    var ii=i;
    return el("button",{className:cls,onclick:isRev?null:function(){selAns(S.current,ii);}},
      [el("span",{className:lc},["A","B","C","D"][i]),el("span",null,opt),
      isRev&&i===q.ans?el("span",{style:"margin-left:auto;color:#16a34a"},"✓"):null,
      isRev&&uAns===i&&i!==q.ans?el("span",{style:"margin-left:auto;color:#ef4444"},"✗"):null]
    );
  }));
  var exp=isRev?el("div",{className:"exp-box "+(isOk?"exp-ok":"exp-wrong")},[
    el("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:6px"},[
      el("span",{style:"font-size:18px"},isOk?"✅":"❌"),
      el("span",{style:"font-weight:700;font-size:14px"},isOk?"Correct!":"Wrong. Correct: "+["A","B","C","D"][q.ans]),
      el("span",{style:"margin-left:auto;font-size:11px;color:#6b7280;font-weight:700"},"⏱ "+fmt(S.qTimes[S.current]||0))
    ]),
    el("p",{style:"font-size:13px;color:#374151;line-height:1.6"},q.exp)
  ]):null;
  var prevB=el("button",{className:"btn btn-outline",style:"flex:1",disabled:S.current===0,onclick:function(){goToQ(S.current-1);}},"← Prev");
  var actB;
  if(!isRev){actB=el("button",{className:"btn btn-primary",style:"flex:1",disabled:uAns===undefined,onclick:function(){revAns(S.current);}},"Check Answer");}

  var subBar=revCnt>0?el("div",{className:"submit-bar"},[

  render(el("div",{className:"wrap"},[
    el("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"},[
      el("button",{style:"color:#2563eb;font-size:13px;font-weight:600;background:none;border:none;cursor:pointer",onclick:function(){clearInterval(S.timerID);renderHome();}},"← Topics"),
      el("div",{style:"font-weight:600;font-size:14px;color:#374151;flex:1;text-align:center;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"},S.topic.name),

    ]),

    el("div",{className:"progress-bar",style:"margin-bottom:12px"},el("div",{className:"progress-fill",style:"width:"+(revCnt/qs.length*100)+"%;background:#2563eb"})),
    dots,

        el("span",{style:"color:#d1d5db"},"·"),
        el("span",{className:"tag-pill",style:tagStyle[q.tag]||"background:#f9fafb;border-color:#e5e7eb;color:#6b7280"},q.tag),

function selAns(qi,oi){if(!S.revealed[qi]){S.answers[qi]=oi;renderQuiz();}}
function revAns(qi){if(S.answers[qi]===undefined){alert("Select an answer first!");return;}var t=stopTimer();S.qTimes[qi]=(S.qTimes[qi]||0)+t;S.revealed[qi]=true;renderQuiz();}
function goToQ(idx){var qs=QUESTION_BANK[S.topic.id]||[];if(idx<0||idx>=qs.length||idx===S.current)return;if(!S.revealed[S.current]){var t=stopTimer();S.qTimes[S.current]=(S.qTimes[S.current]||0)+t;}else clearInterval(S.timerID);S.current=idx;S.curSec=0;renderQuiz();if(!S.revealed[idx])setTimeout(startTimer,50);}

function submitAll(){
  clearInterval(S.timerID);

  var qs=QUESTION_BANK[S.topic.id]||[],correct=0,lb={},tb={};
  qs.forEach(function(q,i){var ok=S.answers[i]===q.ans;if(ok)correct++;
    if(!lb[q.level])lb[q.level]={correct:0,wrong:0,total:0};lb[q.level].total++;ok?lb[q.level].correct++:lb[q.level].wrong++;
    if(!tb[q.tag])tb[q.tag]={correct:0,wrong:0,total:0};tb[q.tag].total++;ok?tb[q.tag].correct++:tb[q.tag].wrong++;
  });
  var at=qs.map(function(_,i){return S.qTimes[i]||0;}),avg=at.length?Math.round(at.reduce(function(a,b){return a+b;},0)/at.length):0;
  var rc=Object.keys(S.revealed).length;
  var a={id:Date.now(),topicId:S.topic.id,topicName:S.topic.name,category:S.topic.category,
    date:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}),
    time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),
    score:correct,total:qs.length,attempted:rc,pct:rc>0?Math.round((correct/rc)*100):0,
